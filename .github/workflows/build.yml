name: Build

on:
  push:
    branches: [main, "auto/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
  VCPKG_DISABLE_METRICS: 1

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Fetch chiaki-ng
        run: ./scripts/init-chiaki-submodules.ps1

      - name: Fetch NVAPI headers
        run: ./scripts/init-nvapi-submodule.ps1

      # NGX headers, the /MD loader library, the two runtimes and their
      # license come from NVIDIA's public DLSS release, pinned by tag.
      - name: Fetch the NVIDIA NGX runtime
        run: |
          $ngx = Join-Path $env:GITHUB_WORKSPACE "ngx"
          New-Item -ItemType Directory -Force (Join-Path $ngx "include") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $ngx "lib") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $ngx "bin") | Out-Null
          $base = "https://raw.githubusercontent.com/NVIDIA/DLSS/v310.9.16"
          foreach ($header in @(
            "nvsdk_ngx.h",
            "nvsdk_ngx_defs.h",
            "nvsdk_ngx_params.h",
            "nvsdk_ngx_loader.h",
            "nvsdk_ngx_defs_dlssg.h",
            "nvsdk_ngx_params_dlssg.h",
            "nvsdk_ngx_helpers_dlssg_d3d.h")) {
            Invoke-WebRequest "$base/include/$header" -OutFile (Join-Path $ngx "include/$header")
          }
          Invoke-WebRequest "$base/lib/Windows_x86_64/x64/nvsdk_ngx_d.lib" -OutFile (Join-Path $ngx "lib/nvsdk_ngx_d.lib")
          Invoke-WebRequest "$base/lib/Windows_x86_64/rel/nvngx_dlss.dll" -OutFile (Join-Path $ngx "bin/nvngx_dlss.dll")
          Invoke-WebRequest "$base/lib/Windows_x86_64/rel/nvngx_dlssg.dll" -OutFile (Join-Path $ngx "bin/nvngx_dlssg.dll")
          Invoke-WebRequest "$base/LICENSE.txt" -OutFile (Join-Path $ngx "LICENSE.txt")

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install chiaki-ng's protobuf generator dependencies
        run: python -m pip install --disable-pip-version-check protobuf grpcio-tools

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The standard library of the newest Visual Studio requires the clang-cl
      # it ships, which is newer than the runner's standalone LLVM.
      - name: Use Visual Studio's clang-cl
        run: |
          $llvm = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
          if (-not (Test-Path (Join-Path $llvm 'clang-cl.exe'))) {
            throw "Visual Studio's clang-cl is not installed in $llvm"
          }
          $llvm >> $env:GITHUB_PATH

      - name: Show toolchain versions
        run: |
          clang-cl --version
          cmake --version
          ninja --version

      - name: Set up vcpkg at the manifest baseline
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init --quiet $vcpkgRoot
          git -C $vcpkgRoot fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $vcpkgRoot checkout --quiet FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
            vcpkg-

      - name: Configure
        run: >
          cmake --preset release
          -DPYTHON_EXECUTABLE="${{ steps.python.outputs.python-path }}"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DLYNX_NGX_ROOT="${{ github.workspace }}/ngx"

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Package
        run: cmake --install build/release --prefix "${{ github.workspace }}/dist/lynx-play"

      - name: Upload the portable package
        uses: actions/upload-artifact@v7
        with:
          name: lynx-play-windows-x64
          path: dist/lynx-play
          if-no-files-found: error
