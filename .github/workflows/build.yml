name: Build

on:
  push:
    branches: [master, "auto/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
  VCPKG_DISABLE_METRICS: 1

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch chiaki-ng
        run: ./scripts/init-chiaki-submodules.ps1

      - name: Fetch NVAPI headers
        run: ./scripts/init-nvapi-submodule.ps1

      - name: Restore the NGX SDK
        id: ngx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ngx
          key: ngx-v310.9.16-${{ hashFiles('scripts/fetch-ngx.ps1') }}

      - name: Fetch the NGX SDK
        id: ngx-fetch
        if: steps.ngx-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-ngx.ps1

      - name: Save the NGX SDK
        if: steps.ngx-fetch.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ngx
          key: ${{ steps.ngx-cache.outputs.cache-primary-key }}

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install chiaki-ng's protobuf generator dependencies
        run: python -m pip install --disable-pip-version-check protobuf grpcio-tools

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      # The standard library of the newest Visual Studio requires the clang-cl
      # it ships, which is newer than the runner's standalone LLVM.
      - name: Use Visual Studio's clang-cl
        run: |
          $llvm = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
          if (-not (Test-Path (Join-Path $llvm 'clang-cl.exe'))) {
            throw "Visual Studio's clang-cl is not installed in $llvm"
          }
          $llvm >> $env:GITHUB_PATH

      - name: Show toolchain versions
        run: |
          clang-cl --version
          cmake --version
          ninja --version

      - name: Set up vcpkg at the manifest baseline
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init --quiet $vcpkgRoot
          git -C $vcpkgRoot fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $vcpkgRoot checkout --quiet FETCH_HEAD
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
            vcpkg-

      - name: Configure
        run: >
          cmake --preset release
          -DPYTHON_EXECUTABLE="${{ steps.python.outputs.python-path }}"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DMFPLAY_NGX_ROOT="${{ github.workspace }}/.ngx"

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Package
        run: cmake --install build/release --prefix "${{ github.workspace }}/dist/mfplay"

      - name: Upload the portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mfplay-windows-x64
          path: dist/mfplay
          if-no-files-found: error
          retention-days: 1

  # Qt 6.10 for Android is built with NDK r27c; the runner's SDK provides the
  # NDK, platform and build tools, installed here only when the image lacks
  # them. The Qt version matches the Windows job.
  android:
    name: Android arm64
    runs-on: ubuntu-24.04
    env:
      # The workflow-level value is the Windows path; this job's is POSIX.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      # The SHA-256 of the fixed signing certificate, the key every release is
      # signed with so updates install over the previous version.
      ANDROID_CERTIFICATE_SHA256: "97:AF:28:23:80:8F:96:B6:39:C4:64:13:9D:06:A2:63:28:78:64:09:A9:34:FA:DE:81:F4:72:86:9D:95:85:00"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch chiaki-ng
        shell: pwsh
        run: ./scripts/init-chiaki-submodules.ps1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install chiaki-ng's protobuf generator dependencies
        run: python -m pip install --disable-pip-version-check protobuf grpcio-tools

      - name: Set up the Android SDK and NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:?the runner has no Android SDK}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          ndk="$sdk/ndk/27.2.12479018"
          packages=()

          [[ -d "$ndk" ]] || packages+=("ndk;27.2.12479018")
          [[ -d "$sdk/platforms/android-36" ]] || packages+=("platforms;android-36")
          [[ -d "$sdk/build-tools/36.0.0" ]] || packages+=("build-tools;36.0.0")

          if (( ${#packages[@]} > 0 )); then
            { for _ in $(seq 100); do echo y; done; } | "$manager" --licenses > /dev/null
            "$manager" --install "${packages[@]}"
          fi

          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Install Qt for the host
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt-host
          cache: true

      # The next install replaces QT_ROOT_DIR, so the host's path is kept here.
      - name: Record the host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: "6.10.3"
          host: all_os
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/qt-android
          cache: true

      - name: Install Ninja
        run: sudo apt-get install -y --no-install-recommends ninja-build

      - name: Set up vcpkg at the manifest baseline
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          root="$RUNNER_TEMP/vcpkg"
          git init --quiet "$root"
          git -C "$root" fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C "$root" checkout --quiet FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p .vcpkg-cache
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vcpkg-cache
          key: android-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            android-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}-
            android-vcpkg-

      - name: Configure
        run: >
          cmake --preset android
          -DPYTHON_EXECUTABLE="${{ steps.python.outputs.python-path }}"
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_FIND_ROOT_PATH="$QT_ROOT_DIR"

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # Tests are host tests: they run in the Windows job, not on Android.
      - name: Build the APK
        run: cmake --build --preset android --target apk -- -k 0

      - name: Find the APK
        id: apk
        run: |
          mapfile -t apks < <(find build/android -name '*.apk' -not -path '*/intermediates/*')

          if (( ${#apks[@]} != 1 )); then
            printf 'Expected one APK, found %d:\n' "${#apks[@]}" >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi

          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      # Fork pull requests get no secrets, so their APK stays unsigned and is
      # never released. Every other run must sign with the fixed key.
      - name: Check the signing secrets
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "::notice::No signing secrets for this pull request; the APK stays unsigned."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The signing secrets are missing; the APK would not update the installed app."
            exit 1
          fi

      - name: Sign the APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          keystore="$RUNNER_TEMP/mfplay-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"

          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          mkdir -p dist/android
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out dist/android/mfplay.apk \
            "$APK"

          digest=$("$apksigner" verify --print-certs dist/android/mfplay.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(printf '%s' "$ANDROID_CERTIFICATE_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          actual=$(printf '%s' "$digest" | tr -d ':' | tr 'A-F' 'a-f')

          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::The APK is signed with a certificate other than the fixed one."
            exit 1
          fi

      - name: Keep the unsigned APK
        if: steps.signing.outputs.enabled != 'true'
        run: |
          mkdir -p dist/android
          cp "${{ steps.apk.outputs.path }}" dist/android/mfplay.apk

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mfplay-android-arm64
          path: dist/android/mfplay.apk
          if-no-files-found: error
          retention-days: 1


  # The artifact expires in a day; the release is where the portable build
  # stays. The version comes from CMakeLists.txt, so a delivery that changes
  # the app bumps it; a push that doesn't bump it keeps the release already
  # published.
  release:
    name: Release
    needs: [windows, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the portable package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mfplay-windows-x64
          path: dist/mfplay

      - name: Download the Android package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mfplay-android-arm64
          path: dist/android

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw),
            'project\(MFPlay\s+VERSION\s+([0-9.]+)').Groups[1].Value
          $tag = "v$version"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping it."
            exit 0
          }
          Compress-Archive -Path dist/mfplay/* -DestinationPath mfplay-windows-x64.zip
          $apk = "mfplay-$version-android-arm64.apk"
          Copy-Item dist/android/mfplay.apk $apk
          gh release create $tag `
            --title "MFPlay $version" `
            --notes "Portable build of master at ``${{ github.sha }}``." `
            --latest `
            mfplay-windows-x64.zip `
            $apk
          # Keep the newest twelve releases; older assets would pile up.
          $old = gh release list --limit 100 --json tagName --jq ".[12:][] | .tagName"
          foreach ($name in $old) {
            gh release delete $name --yes --cleanup-tag
          }

  # Artifacts count against the account's storage; keep the newest two of each
  # name (one per branch building in parallel; each is tested within minutes of
  # finishing).
  purge-artifacts:
    name: Purge old artifacts
    needs: [windows, android]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Purge old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = (gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" | ConvertFrom-Json).artifacts
          foreach ($group in ($artifacts | Group-Object name)) {
            $group.Group | Sort-Object created_at -Descending | Select-Object -Skip 2 | ForEach-Object {
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($_.id)" | Out-Null
            }
          }

